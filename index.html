<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Libre</title>
  </head>
  <body>
    <main class="app">
      <section class="preview-col">
        <div id="preview" class="preview"></div>
        <p id="status" class="status" data-kind="idle"></p>
        <ul id="warnings" class="warnings"></ul>
      </section>

      <section class="controls">
        <header class="top">
          <h1>QR Libre</h1>
          <div class="row">
            <button id="reset" type="button" data-i18n="reset"></button>
            <button id="lang" type="button" data-i18n="langToggle"></button>
          </div>
        </header>

        <fieldset>
          <legend data-i18n="content"></legend>
          <label class="field"><span data-i18n="urlLabel"></span>
            <input id="text" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="urlPlaceholder" />
          </label>
          <label class="field"><span data-i18n="ecc"></span>
            <select id="ecc">
              <option value="L" data-i18n="eccL"></option>
              <option value="M" data-i18n="eccM"></option>
              <option value="Q" data-i18n="eccQ"></option>
              <option value="H" data-i18n="eccH"></option>
            </select>
          </label>
        </fieldset>

        <fieldset>
          <legend data-i18n="shape"></legend>
          <label class="field"><span><span data-i18n="moduleRadius"></span> · <output id="moduleRadiusValue"></output></span><input id="moduleRadius" type="range" min="0" step="1" /></label>
          <label class="field"><span><span data-i18n="eyeRadius"></span> · <output id="eyeRadiusValue"></output></span><input id="eyeRadius" type="range" min="0" step="1" /></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="color"></legend>
          <label class="field"><span data-i18n="fillMode"></span>
            <select id="fillMode">
              <option value="solid" data-i18n="solid"></option>
              <option value="linear" data-i18n="linear"></option>
              <option value="radial" data-i18n="radial"></option>
            </select>
          </label>
          <div class="row">
            <label class="swatch"><input id="color1" type="color" /><span data-i18n="color1"></span></label>
            <label class="swatch grad-only"><input id="color2" type="color" /><span data-i18n="color2"></span></label>
          </div>
          <label class="field linear-only"><span><span data-i18n="angle"></span> · <output id="gradientAngleValue"></output></span><input id="gradientAngle" type="range" min="0" max="360" step="5" /></label>
          <div class="row">
            <label class="check"><input id="eyeColorEnabled" type="checkbox" /><span data-i18n="eyeColor"></span></label>
            <input id="eyeColor" type="color" />
          </div>
          <div class="contrast">
            <span data-i18n="contrast"></span>
            <meter id="contrastMeter" min="1" max="21" low="4" high="7" optimum="21"></meter>
            <span id="contrastValue"></span>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="background"></legend>
          <div class="row">
            <label class="swatch"><input id="bgColor" type="color" /><span data-i18n="bgColor"></span></label>
            <label class="check"><input id="bgTransparent" type="checkbox" /><span data-i18n="transparent"></span></label>
          </div>
          <label class="field"><span><span data-i18n="margin"></span> · <output id="marginValue"></output></span>
            <input id="margin" type="range" min="0" max="8" step="1" />
          </label>
          <label class="field"><span><span data-i18n="bgRadius"></span> · <output id="bgRadiusValue"></output></span><input id="bgRadius" type="range" min="0" step="1" /></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="export"></legend>
          <label class="field"><span data-i18n="target"></span>
            <select id="target">
              <option value="screen" data-i18n="targetScreen"></option>
              <option value="print" data-i18n="targetPrint"></option>
            </select>
          </label>
          <p id="targetDesc" class="hint"></p>
          <label class="field"><span data-i18n="size"></span>
            <select id="exportSize">
              <option value="512">512 px</option>
              <option value="1024">1024 px</option>
              <option value="2048">2048 px</option>
              <option value="4096">4096 px</option>
            </select>
          </label>
          <p id="physical" class="hint"></p>
          <div class="row">
            <button id="savePng" type="button" class="primary" data-i18n="savePng"></button>
            <button id="saveSvg" type="button" data-i18n="saveSvg"></button>
          </div>
          <p id="exportMsg" class="hint"></p>
        </fieldset>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
