name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --no-bundle
      - name: Name the portable exe
        shell: pwsh
        run: Copy-Item src-tauri/target/release/qr-libre.exe "qr-libre-${{ github.ref_name }}-windows-x64.exe"
      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: qr-libre-windows-x64
          path: qr-libre-*-windows-x64.exe
      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: qr-libre-${{ github.ref_name }}-windows-x64.exe
          generate_release_notes: true
